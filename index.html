<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>의정부, 2층 끝 집 — 붓다 섯다</title>

<meta property="og:type" content="website">
<meta property="og:title" content="의정부, 2층 끝 집">
<meta property="og:description" content="붓다 섯다 · 다시 열리는 날 (12.17)">
<meta property="og:image" content="https://linglingbeel-dev.github.io/bdsd-home/img/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://linglingbeel-dev.github.io/bdsd-home/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="의정부, 2층 끝 집">
<meta name="twitter:description" content="붓다 섯다 · 다시 열리는 날 (12.17)">
<meta name="twitter:image" content="https://linglingbeel-dev.github.io/bdsd-home/img/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#efe8dc;--dim:#a39c90;--accent:#f0cf95;--card:rgba(22,23,27,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0b0b0d;color:var(--ink);font-family:'Gowun Dodum',sans-serif;overflow:hidden}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;overflow:hidden;background:#000}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* 뷰어 */
#viewer{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
#stage{position:absolute;top:0;left:0;height:100%;will-change:transform;transform-origin:0 0}
#scene{position:absolute;inset:0;transform-origin:50% 50%}
#scene img{height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#dusk{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(14,20,44,.95),rgba(8,10,24,.95));opacity:0;transition:opacity 2.5s}
#final .btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:22px}
#final .sub2{font-size:13px;color:#d8d0c3;text-decoration:underline;text-underline-offset:4px}
.ov{position:absolute;inset:0;z-index:50;background:#0d0d10;display:none;flex-direction:column}
.ov.on{display:flex}
.ov .head{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 12px;border-bottom:1px solid #26262b}
.ov .head b{font-family:'Gowun Batang',serif;font-size:17px;font-weight:700}
.ov .head button{font-size:13px;color:var(--dim)}
#albumGrid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.al{display:flex;flex-direction:column;gap:6px;text-align:left}
.al i{display:block;aspect-ratio:1/1;border-radius:8px;background-repeat:no-repeat;background-color:#111}
.al span{font-size:12px;color:#cfc8bb}
.al.miss i{filter:brightness(.15) grayscale(1)}
.al.miss span{color:#555}
#cardBody{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:16px}
#cardImg{width:100%;max-width:420px;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#cardBody p{font-size:13px;color:var(--dim);margin:14px 0 6px;text-align:center;line-height:1.7}
#cardBody a{font-size:13px;color:var(--accent)}
#veil.on{opacity:1}

.hot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;cursor:pointer}
.hot::before{content:'';position:absolute;inset:15px;border-radius:50%;background:rgba(255,235,200,.9);box-shadow:0 0 12px 4px rgba(255,210,150,.55)}
.hot::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(255,225,180,.8);animation:ring 2s ease-out infinite}
.hot.found::before{background:rgba(255,255,255,.35);box-shadow:none;inset:19px}
.hot.found::after{display:none}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.4);opacity:0}}
.go{position:absolute;margin:-26px 0 0 -26px;width:52px;height:52px;border-radius:50%;background:rgba(10,10,12,.45);border:1.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.go svg{width:22px;height:22px}
.go span{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;background:rgba(10,10,12,.55);padding:3px 9px;border-radius:99px}

/* 상단·하단 */
#top{position:absolute;top:0;left:0;right:0;padding:16px 18px 30px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none;z-index:5}
#place{font-family:'Gowun Batang',serif;font-size:17px;text-shadow:0 1px 6px #000}
#count{font-size:12px;color:#ddd;text-shadow:0 1px 4px #000;padding-top:3px}
#topR{display:flex;align-items:center;gap:12px}
#snd{pointer-events:auto;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
#snd svg{width:15px;height:15px}
#hint{position:absolute;left:0;right:0;bottom:84px;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .6s;z-index:5}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:5}
.chip{font-size:13px;padding:8px 14px;border-radius:99px;background:rgba(20,20,24,.6);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.chip small{color:var(--accent);margin-left:4px}

/* 카드 */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:18px 18px 0 0;padding:16px 22px 26px;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow:auto}
#sheet.on{transform:none}
#shade{position:absolute;inset:0;z-index:59;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .4s}
#shade.on{opacity:1;pointer-events:auto}
#shot{width:100%;aspect-ratio:1/1;border-radius:10px;background-color:#111;background-repeat:no-repeat;margin-bottom:16px;position:relative;overflow:hidden}
#sheet h3{margin:0 0 10px;font-family:'Gowun Batang',serif;font-size:18px;color:var(--accent)}
#sheet p{margin:0;font-family:'Gowun Batang',serif;font-size:15.5px;line-height:1.9;white-space:pre-line}
#sheet .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
#sheet .close{font-size:13px;color:var(--dim);padding:6px 0}
#sheet .next{font-size:13px;color:var(--accent);padding:6px 0}
.memoText{position:absolute;left:33.5%;top:37%;width:36%;height:32%;transform:rotate(-2deg);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Nanum Brush Script',cursive;font-size:clamp(18px,5.6vw,26px);line-height:1.15;color:#5a5866;opacity:.88;white-space:pre-line;overflow:hidden}

/* 도어락 */
#lock{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
#lock.on{display:flex}
.pad{width:210px;background:linear-gradient(#26272b,#141417);border-radius:16px;padding:18px 16px 14px;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
.pad .scr{height:30px;display:flex;justify-content:center;gap:10px;align-items:center;margin-bottom:12px}
.pad .scr i{width:9px;height:9px;border-radius:50%;background:#333}
.pad .scr i.on{background:#7fd6ff;box-shadow:0 0 8px #7fd6ff}
.pad .scr.err i{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b}
.pad .scr.ok i{background:#7dffa6;box-shadow:0 0 8px #7dffa6}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:44px;border-radius:50%;font-size:19px;color:#cfefff;text-shadow:0 0 8px rgba(120,210,255,.8);background:rgba(255,255,255,.03)}
.keys button:active{background:rgba(120,210,255,.2)}
.pad .h{font-size:12px;color:var(--dim);text-align:center;margin-top:12px;min-height:16px}
.pad .x{display:block;margin:8px auto 0;font-size:12px;color:#777}

/* 타이틀·엔딩 */
.full{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px}
.full.on{display:flex}
#title{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.75)),url(img/corridor.jpg) 45% center/cover}
#title .date,#final .date{letter-spacing:.45em;font-size:13px;color:var(--accent);margin-bottom:26px}
#title h1{font-family:'Gowun Batang',serif;font-size:31px;margin:0 0 10px;line-height:1.4;text-shadow:0 2px 14px #000}
#title .sub{color:#d6cfc3;font-size:14px;margin-bottom:54px;text-shadow:0 1px 6px #000}
.btn{border:1px solid rgba(255,255,255,.45);padding:12px 28px;border-radius:999px;font-size:15px;background:rgba(0,0,0,.25);color:var(--ink);text-decoration:none;display:inline-block}
#title .foot{position:absolute;bottom:26px;left:0;right:0;font-size:12px;color:#aaa}
#ending{background:#08080a;cursor:pointer;overflow:hidden}
#ending::before{content:'';position:absolute;inset:0;background:url(img/entry.jpg) 50% center/cover;filter:brightness(1.25) saturate(1.1) sepia(.15);opacity:0;transition:opacity 2.2s}
#ending::after{content:'';position:absolute;inset:0;background:rgba(8,8,10,.62);opacity:0;transition:opacity 2.2s}
#ending.lit::before{opacity:1}
#ending.lit::after{opacity:1}
#ending>*{position:relative;z-index:1}
#endLines{font-family:'Gowun Batang',serif;font-size:16px;line-height:2;min-height:260px;max-height:80vh;overflow:auto;display:flex;flex-direction:column;justify-content:center}
#endLines .n{color:#cfc7ba;font-size:14.5px}
#endLines .q{color:#fff}
#endLines .big{color:#fff;font-weight:700;font-size:21px;margin-top:22px}
#endLines div{opacity:0;transition:opacity .9s}
#endLines div.on{opacity:1}
#endLines .sfx{color:var(--dim);font-size:14px;letter-spacing:.15em}
#ending .tap{position:absolute!important;bottom:26px;left:0;right:0;font-size:12px;color:#777}
#final{background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.88)),url(img/door.jpg) center/cover}
#final h2{font-family:'Gowun Batang',serif;font-size:27px;margin:0 0 18px}
#final p{font-family:'Gowun Batang',serif;color:#d8d0c3;line-height:1.95;font-size:15px;margin:0 0 30px}
#final .note{font-size:12px;color:var(--dim);margin-top:26px;line-height:1.7}
#final .again{margin-top:14px;font-size:12px;color:#888;text-decoration:underline}
</style>
</head>
<body>
<div id="app">
  <div id="viewer">
    <div id="stage"><div id="scene"><img id="photo" alt=""><div id="spots"></div></div></div>
    <div id="dusk"></div>
    <div id="veil"></div>
  </div>
  <div id="top"><div id="place"></div><div id="topR"><div id="count"></div><button id="snd" aria-label="소리"></button></div></div>
  <audio id="amb" src="audio/ambience.mp3" loop preload="auto"></audio>
  <audio id="mus" src="audio/laptop.mp3" loop preload="auto"></audio>
  <div id="hint">화면을 좌우로 끌어서 둘러보세요</div>
  <div id="bottom"></div>

  <div id="shade"></div>
  <div id="sheet">
    <div id="shot"></div>
    <h3 id="sTitle"></h3>
    <p id="sText"></p>
    <div class="row"><button class="close" id="sClose">닫기</button><button class="next" id="sNext"></button></div>
  </div>

  <div id="lock"><div class="pad">
    <div class="scr" id="scr"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys"></div>
    <div class="h" id="lockHint">비밀번호 네 자리</div>
    <button class="x" id="lockClose">닫기</button>
  </div></div>

  <section id="title" class="full on">
    <div class="date">12 · 17</div>
    <h1>의정부,<br>2층 끝 집</h1>
    <div class="sub">붓다 섯다 · 다시 열리는 날</div>
    <button class="btn" id="startBtn">들어가 보기</button>
    <div class="foot">망통</div>
  </section>

  <section id="ending" class="full">
    <div id="endLines"></div>
    <div class="tap">화면을 누르세요</div>
  </section>

  <section id="final" class="full">
    <div class="date">12 · 17</div>
    <h2>붓다 섯다</h2>
    <p>두 사람이 다시 만난 날,<br>이야기를 다시 엽니다.</p>
    <a class="btn" id="readLink" href="https://posty.pe/pehre1zc" target="_blank" rel="noopener">포스타입에서 읽기</a>
    <div class="btns">
      <button class="sub2" id="openAlbum">찾은 물건 모아 보기</button>
      <button class="sub2" id="openCard">다녀온 인증 카드 만들기</button>
    </div>
    <div class="note">본편에는 성인 독자를 위한 내용이 포함되어 있어요.</div>
    <button class="again" id="again">처음부터 다시 둘러보기</button>
  </section>

  <section id="album" class="ov">
    <div class="head"><b>2층 끝 집의 물건들</b><button id="albumClose">닫기</button></div>
    <div id="albumGrid"></div>
  </section>
  <section id="cardOv" class="ov">
    <div class="head"><b>다녀온 인증 카드</b><button id="cardClose">닫기</button></div>
    <div id="cardBody">
      <img id="cardImg" alt="다녀온 인증 카드">
      <p>이미지를 꾹 눌러 저장하세요.</p>
      <a id="cardDl" download="2층끝집.png" href="#">PC에서 저장하기</a>
    </div>
  </section>
</div>

<script>
/* ================= 데이터 =================
   좌표(x, y)는 사진 안의 위치 비율(0~1)  */
const MEMO_TEXT = '냉장고 안에\n메론 깎아놨어';

const NODES = {
  corridor:{ name:'2층 복도', img:'corridor', start:.45,
    links:[{to:'door', label:'끝 집으로', x:.46, y:.47}], objs:[] },
  door:{ name:'복도 끝 집', img:'door', start:.45, links:[], objs:[], lock:{x:.40, y:.48} },
  entry:{ name:'현관', img:'entry', start:.5,
    links:[
      {to:'living',  label:'거실', x:.52, y:.62},
      {to:'kitchen', label:'부엌', x:.43, y:.36},
      {to:'storage', label:'왼쪽 방', x:.27, y:.50},
      {to:'bath',    label:'오른쪽 문', x:.70, y:.42}],
    objs:[
      {id:'boots', x:.535, y:.845, t:'작업화',
       p:'엄성현의 작업화.\n두 켤레를 번갈아 신는다.\n오늘은 검은색을 신고 나갔다.\n\n매일 털어도 매일 허얘진다고\n요새는 잘 닦지도 않는다.'},
      {id:'sneakers', x:.69, y:.855, t:'운동화',
       p:'안건호의 운동화.\n뒤꿈치를 꺾어 신는 버릇이 여전하다.'}]},
  living:{ name:'거실', img:'living', start:.5,
    links:[
      {to:'balcony', label:'베란다', x:.56, y:.43},
      {to:'bedroom', label:'안방', x:.04, y:.40},
      {to:'kitchen', label:'부엌', x:.96, y:.40}],
    back:'entry',
    objs:[
      {id:'snack', x:.10, y:.61, t:'과자 봉지',
       p:'소파 팔걸이 옆에 사또밥 봉지.\n며칠 전에 먹다 남긴 입구를\n성현이 빨래집게로 물려 놨다.'},
      {id:'tang', x:.46, y:.61, t:'귤',
       p:'까먹고서 껍질 그대로 둔 사람 안건호.'},
      {id:'earphone', x:.835, y:.545, t:'이어폰',
       p:'줄이 귤 모양 줄감개에 감겨 있다.\n\n삭은 탓에 새것으로 사준다고 했지만\n건호에게 매번 거절당했다.'},
      {id:'laptop', x:.855, y:.485, t:'노트북',
       p:'건호가 켜 놓은 노래가 흘러나오고 있다.'},
      {id:'dict', x:.88, y:.595, t:'불어 사전',
       p:'두꺼운 불어 사전.\n사이에 연습장 한 장이 끼워져 있다.\n\nIl se rencontre un jour.\n\n성현이 무슨 뜻이냐고 묻자\n건호는 웃기만 했다.'},
      {id:'plant', x:.925, y:.59, t:'화분',
       p:'성현이 어느 날 갑자기 들고 온 화분.\n\n뭐냐고 묻자\n김 반장님이 집에 초록색이 있어야 한다고 했단다.'},
      {id:'cushion', x:.46, y:.86, t:'방석',
       p:'절에서 생활한 탓에\n바닥에 아무렇게나 주저앉는 건호 때문에\n성현이 사 온 방석.'},
      {id:'stove', x:.10, y:.86, t:'전기난로',
       p:'구식 전기난로.\n보일러를 켜도 추울 때면 한 번씩 사용한다.\n근처 철물점에서 사 왔다.'}]},
  kitchen:{ name:'부엌', img:'kitchen', start:.4,
    links:[{to:'living', label:'거실', x:.92, y:.45}], back:'entry',
    objs:[
      {id:'memo', x:.14, y:.26, t:'냉장고 메모', memo:true,
       p:'자석 하나에 중요한 고지서와\n성현이 쓴 메모가 여러 장 겹쳐 있다.\n맨 윗장만 읽을 수 있다.\n\n냉장고 속 메론은\n성현이 어제 퇴근길에 사 왔다.'},
      {id:'pot', x:.68, y:.39, t:'냄비',
       p:'성현이 며칠 전에 끓인 김치찌개.\n맵지 않고 맛있다.'},
      {id:'corner', x:.45, y:.80, t:'식탁 모서리',
       p:'모서리마다 보호대가 붙어 있다.\n아이가 있는 집에서\n성현이 중고로 싸게 사 왔다고 했다.\n\n건호는 식탁에 앉을 때마다\n보호대를 괜히 만져 본다.\n한 번씩 부딪히는 성현 때문에\n보호대가 있어서 다행이라고 생각하면서.'}]},
  bedroom:{ name:'안방', img:'bedroom', start:.42, links:[], back:'living',
    objs:[
      {id:'drawer', x:.33, y:.585, t:'협탁',
       p:'협탁 서랍이 열려 있다.\n\n…안에는 들춰 보지 말자.'},
      {id:'perfume', x:.23, y:.545, t:'향수',
       p:'성현의 생일 때 건호가 선물해 줬던 향수.\n그날 이후로 조금씩 썼는지\n반 정도 줄었다.'},

  const o=ac.createOscillator(),g=ac.createGain(); o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+d);

  v.addEventListener('pointerdown',e=>{ if(busy) return; down=true;moved=false;sx=e.clientX;sp=panX;lx=e.clientX;lt=performance.now();vel=0;cancelAnimationFrame(raf); });
  addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true;
    panX=sp+dx; clampPan(); applyPan(); const t=performance.now(); vel=(e.clientX-lx)/Math.max(1,t-lt); lx=e.clientX; lt=t;
    if(moved) $('#hint').style.opacity=0; });
  addEventListener('pointerup',()=>{ if(!down) return; down=false;
    (function glide(){ vel*=.93; if(Math.abs(vel)<.02) return; panX+=vel*16; clampPan(); applyPan(); raf=requestAnimationFrame(glide); })(); });

const amb=$('#amb'); let actx=null, lp=null, gn=null, muted=false, ambOn=false;
const OUTSIDE={corridor:1,door:1};
function ambInit(){
  if(ambOn) return; ambOn=true;
  try{
    actx=ac||new (window.AudioContext||window.webkitAudioContext)(); ac=actx;
    const src=actx.createMediaElementSource(amb);
    lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=16000; lp.Q.value=.5;
    gn=actx.createGain(); gn.gain.value=0;
    src.connect(lp); lp.connect(gn); gn.connect(actx.destination);
    if(actx.state==='suspended') actx.resume();
  }catch(e){ actx=null; amb.volume=.6; }
  amb.play().catch(()=>{});
  ambRoom(cur||'corridor', 2.5);
}
function ambSet(g, f, sec=1.2){
  if(actx&&gn){ const t=actx.currentTime;
    gn.gain.cancelScheduledValues(t); gn.gain.setValueAtTime(gn.gain.value,t); gn.gain.linearRampToValueAtTime(muted?0:g,t+sec);
    lp.frequency.cancelScheduledValues(t); lp.frequency.setValueAtTime(lp.frequency.value,t); lp.frequency.exponentialRampToValueAtTime(f,t+sec);
  } else { amb.volume=muted?0:Math.min(1,g); }
}
function ambRoom(id,sec){ if(!ambOn) return; OUTSIDE[id] ? ambSet(.85,16000,sec) : ambSet(.18,550,sec); }
function sndIcon(){ $('#snd').innerHTML = muted

  : '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>'; }
sndIcon();
$('#snd').onclick=()=>{ muted=!muted; sndIcon(); if(!ambOn){ambInit();return;} if(!muted){ amb.play().catch(()=>{}); if(musOn) mus.play().catch(()=>{}); } ambRoom(cur,.4); musRoom(cur,.4); };
document.addEventListener('visibilitychange',()=>{ if(!ambOn) return; if(document.hidden){amb.pause();mus.pause();} else if(!muted){amb.play().catch(()=>{}); if(musOn) mus.play().catch(()=>{});} });


/* 노트북 노래: 거실에서 가장 크게, 멀어질수록 작고 먹먹하게 */
const mus=$('#mus'); let mlp=null, mgn=null, musOn=false;
const MUS_ROOM={ living:[1,12000], kitchen:[.55,2200], entry:[.5,1800], balcony:[.4,1300], bedroom:[.32,900], storage:[.25,750], bath:[.22,700] };
function musInit(){
  if(musOn) return; musOn=true;
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaElementSource(mus);
    mlp=ac.createBiquadFilter(); mlp.type='lowpass'; mlp.frequency.value=1800;

    src.connect(mlp); mlp.connect(mgn); mgn.connect(ac.destination);

}
function musSet(g,f,sec=1.4){
  if(!musOn) return;
  if(mgn&&ac){ const t=ac.currentTime;
    mgn.gain.cancelScheduledValues(t); mgn.gain.setValueAtTime(mgn.gain.value,t); mgn.gain.linearRampToValueAtTime(muted?0:g*.9,t+sec);
    mlp.frequency.cancelScheduledValues(t); mlp.frequency.setValueAtTime(mlp.frequency.value,t); mlp.frequency.exponentialRampToValueAtTime(f,t+sec);
  } else mus.volume=muted?0:Math.min(1,g*.6);
}
function musRoom(id,sec){ const r=MUS_ROOM[id]; r?musSet(r[0],r[1],sec):musSet(0,600,sec); }

const SFX={}; ['door_open','door_close','end_unlock','end_clunk','end_lock'].forEach(k=>{const a=new Audio('audio/'+k+'.mp3');a.preload='auto';SFX[k]=a;});
function sfx(k,vol=1){ try{ const a=SFX[k]; a.pause(); a.currentTime=0; a.volume=muted?0:vol; const p=a.play(); if(p) p.catch(()=>{}); return a; }catch(e){} }

/* ================= 물건 소리 ================= */
function nz(t,dur,type,f,g,q=1){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const len=Math.max(1,ac.sampleRate*dur), b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=ac.createBufferSource(); s.buffer=b; const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  const gn2=ac.createGain(); gn2.gain.value=muted?0:g; s.connect(fl); fl.connect(gn2); gn2.connect(ac.destination); s.start(ac.currentTime+t);}catch(e){} }
function tone(t,f1,f2,dur,g){ try{ const o=ac.createOscillator(), gg=ac.createGain(); const T=ac.currentTime+t;
  o.frequency.setValueAtTime(f1,T); o.frequency.exponentialRampToValueAtTime(f2,T+dur);
  gg.gain.setValueAtTime(muted?0:g,T); gg.gain.exponentialRampToValueAtTime(.0001,T+dur);
  o.connect(gg); gg.connect(ac.destination); o.start(T); o.stop(T+dur+.02);}catch(e){} }
/* 봉지 바스락: 촘촘하게 요동치는 고음 잡음 */
function crinkle(dur,g){ try{ const sr=ac.sampleRate, len=Math.floor(sr*dur), b=ac.createBuffer(1,len,sr), d=b.getChannelData(0);
  let e=0, target=0, next=0;
  for(let i=0;i<len;i++){
    if(i>=next){ target=Math.random()<.25?.08:(.25+Math.random()*.75); next=i+Math.floor(sr*(.004+Math.random()*.018)); }
    e+= (target-e)*.02;
    const fade=Math.min(1,i/(sr*.06))*Math.min(1,(len-i)/(sr*.15));
    d[i]=(Math.random()*2-1)*e*fade;
  }
  const src=ac.createBufferSource(); src.buffer=b;
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000;
  const pk=ac.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=4500; pk.gain.value=5; pk.Q.value=.7;
  const gg=ac.createGain(); gg.gain.value=muted?0:g;
  src.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(gg); gg.connect(ac.destination); src.start(ac.currentTime+.02);
}catch(e){} }
function objSound(id){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ return; }
  if(id==='pot'){ for(let i=0;i<14;i++){ const t=Math.random()*1.8; tone(t,250+Math.random()*250,600+Math.random()*500,.05+Math.random()*.05,.06); } }
  if(id==='stove'){ nz(0,.03,'highpass',3000,.5); tone(.02,900,700,.03,.08); nz(.05,1.6,'lowpass',180,.05); }
  if(id==='boiler'){ nz(0,.03,'highpass',2500,.4); nz(.15,1.8,'lowpass',220,.12); }
  if(id==='tub'){ [0,.55,1.3].forEach(t=>tone(t,1500,420,.09,.12)); }
  if(id==='laptop' && musOn){ musSet(1.7,16000,.6); setTimeout(()=>musRoom(cur,1.5),5000); }
}

  const bg=await load('img/entry.jpg');
  x.fillStyle='#0c0c0f'; x.fillRect(0,0,W,H);
  if(bg){ const s=Math.max(W/bg.width,H/bg.height), w=bg.width*s, h=bg.height*s; x.globalAlpha=.55; x.drawImage(bg,(W-w)/2,(H-h)/2,w,h); x.globalAlpha=1; }
  const gr=x.createLinearGradient(0,0,0,H); gr.addColorStop(0,'rgba(8,8,10,.55)'); gr.addColorStop(.45,'rgba(8,8,10,.75)'); gr.addColorStop(1,'rgba(8,8,10,.92)');
  x.fillStyle=gr; x.fillRect(0,0,W,H);
  x.textAlign='center'; x.fillStyle='#f0cf95'; x.font='400 30px "Gowun Dodum", sans-serif';
  x.fillText('1 2   ·   1 7', W/2, 150);
  x.fillStyle='#efe8dc'; x.font='700 66px "Gowun Batang", serif';
  x.fillText('의정부, 2층 끝 집에', W/2, 260); x.fillText('다녀왔습니다', W/2, 350);
  x.fillStyle='#cfc7ba'; x.font='400 30px "Gowun Dodum", sans-serif';
  x.fillText(`찾은 물건 ${found.size} / ${ALL.length}`, W/2, 425);
  const imgs={}; for(const k of new Set(OBJ_LIST.map(o=>NODES[o.node].img))) imgs[k]=await load('img/'+k+'.jpg');
  const cols=6, cell=152, gap=12, gx=(W-(cols*cell+(cols-1)*gap))/2, gy=490;
  OBJ_LIST.forEach((o,i)=>{ const im=imgs[NODES[o.node].img]; const cx=gx+(i%cols)*(cell+gap), cy=gy+Math.floor(i/cols)*(cell+gap);
    x.save(); const r=12; x.beginPath(); x.moveTo(cx+r,cy); x.arcTo(cx+cell,cy,cx+cell,cy+cell,r); x.arcTo(cx+cell,cy+cell,cx,cy+cell,r); x.arcTo(cx,cy+cell,cx,cy,r); x.arcTo(cx,cy,cx+cell,cy,r); x.closePath(); x.clip();
    if(im && found.has(o.id)){ const sz=im.height/3.2; let sx=o.x*im.width-sz/2, sy=o.y*im.height-sz/2; sx=Math.max(0,Math.min(im.width-sz,sx)); sy=Math.max(0,Math.min(im.height-sz,sy)); x.drawImage(im,sx,sy,sz,sz,cx,cy,cell,cell); }
    else { x.fillStyle='#1a1a1e'; x.fillRect(cx,cy,cell,cell); }
    x.restore(); });
  x.fillStyle='#9c958a'; x.font='400 28px "Gowun Dodum", sans-serif';
  x.fillText('붓다 섯다 · 다시 열리는 날', W/2, H-110);
  x.fillStyle='#6f6a62'; x.font='400 24px "Gowun Dodum", sans-serif'; x.fillText('망통', W/2, H-66);
  return c.toDataURL('image/png');
}

const END=[
  ['sfx','삑, 삑, 삑, 삑.','beeps'],
  ['sfx','띠리릭.','melody'],
  ['sfx','철커덩.','clunk'],
  ['q','“건호야.”'],
  ['n','성현의 목소리.'],
  ['n','평소보다 일찍 돌아왔다.'],
  ['q','“밖에 춥지?”'],
  ['q','“완전. 보일러 안 켰어?”'],

  ['q','“아까까지 켜 놨다가 방금 껐어.”'],
  ['n','현관 불이 켜진다.','light'],
  ['break'],
  ['q','“저녁에 삼겹살 먹을까?”'],
  ['n','물음에 건호가 웃는다.'],

  ['big','“다녀왔어.”']
];
let ei=0;
function clunk(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime, len=ac.sampleRate*.35, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6);
  const n=ac.createBufferSource(); n.buffer=buf; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=2.5;
  const g=ac.createGain(); g.gain.value=.5; n.connect(bp); bp.connect(g); g.connect(ac.destination); n.start(t);
  const o=ac.createOscillator(), og=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(45,t+.25);
  og.gain.setValueAtTime(.45,t); og.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t+.32);
  const n2=ac.createBufferSource(); n2.buffer=buf; const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3000; const g2=ac.createGain(); g2.gain.value=.25;
  n2.connect(hp); hp.connect(g2); g2.connect(ac.destination); n2.start(t+.12);
}catch(e){} }
let page=[];
function buildPage(){ const L=$('#endLines'); L.innerHTML=''; page=[];
  while(ei<END.length && END[ei][0]!=='break'){ const [c,t,fx]=END[ei]; const d=document.createElement('div'); d.className=c; d.textContent=t; L.appendChild(d); page.push({d,fx}); ei++; }
  if(ei<END.length && END[ei][0]==='break') ei++;
}
let pi=0, fading=false;
function startEnding(){ ambSet(.12,550,2); musSet(.3,1400,2); const E=$('#ending'); E.classList.remove('lit'); E.classList.add('on'); ei=0; pi=0; buildPage(); endNext(); }
function endNext(){
  if(fading) return;
  if(pi<page.length){ const {d,fx}=page[pi];
    if(fx==='beeps') [1900,1900,1900,1900].forEach((f,i)=>beep(f,.05,i*.18));
    if(fx==='melody') sfx('end_unlock');
    if(fx==='clunk'){ const u=SFX.end_unlock, go2=()=>sfxThen('end_clunk',()=>sfx('end_lock',.9)); if(!u.paused&&!u.ended){ u.onended=()=>{u.onended=null;go2();}; } else go2(); }
    if(fx==='light') $('#ending').classList.add('lit');
    d.classList.add('on'); pi++; return; }
  if(ei<END.length){ fading=true; [...$('#endLines').children].forEach(x=>x.classList.remove('on'));
    setTimeout(()=>{ buildPage(); pi=0; fading=false; endNext(); },1000); return; }
  ambSet(.3,1200,2.5); $('#ending').classList.remove('on'); $('#final').classList.add('on');
}
$('#ending').onclick=endNext;
$('#again').onclick=()=>{ endedOnce=false; ambRoom('corridor',1.5); musSet(0,600,1.5); found.clear(); unlocked=false; fails=0; $('#final').classList.remove('on'); $('#title').classList.add('on'); };
